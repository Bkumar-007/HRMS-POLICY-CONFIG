server:
  port: 8080

spring:
  application:
    name: hr-assistant
  datasource:
    url: jdbc:postgresql://localhost:5432/hr_assistant
    username: hr_user
    password: hr_pass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  ai:
    # Same fail-fast retry for every chat message (leave balance, leave policy, hello, etc.)
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 1.5
        max-interval: 3s
    model:
      chat: google-genai
      # embedding + pgvector enabled in Phase 3 (RAG)
      embedding: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          # Property path must be chat.model (not only options.model) or Spring AI keeps default gemini-2.0-flash
          model: gemini-3.8-flash
          temperature: 0.3
          options:
            model: gemini-3.8-flash
            temperature: 0.3

app:
  jwt:
    secret: ${JWT_SECRET:acme-hr-assistant-dev-secret-change-me-32chars-min}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.acme.hrassistant: INFO
    org.springframework.ai: INFO