server:
  port: ${SERVER_PORT:8080}

# Flat keys: Ollama auto-config uses matchIfMissing=true on spring.ai.model.embedding.
# Nested YAML (embedding.text) leaves that property "missing" and would start both beans.
spring.ai.model.chat: google-genai
spring.ai.model.embedding: none
spring.ai.model.embedding.text: google-genai

spring:
  application:
    name: hr-assistant
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hr_assistant}
    username: ${SPRING_DATASOURCE_USERNAME:hr_user}
    password: ${SPRING_DATASOURCE_PASSWORD:hr_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  ai:
    # Same fail-fast retry for every chat message (leave balance, leave policy, hello, etc.)
    retry:
      max-attempts: 2
      backoff:
        # Spring Retry requires multiplier strictly > 1
        initial-interval: 1000ms
        multiplier: 2.0
        max-interval: 3000ms
    chat:
      memory:
        repository:
          jdbc:
            # Postgres is not "embedded"; always create SPRING_AI_CHAT_MEMORY
            initialize-schema: always
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # Must match embedding output dimensions below
        dimensions: 768
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          # Free-tier default: Flash-Lite (~higher RPD than gemini-3.8-flash's ~20/day).
          # Override with GEMINI_CHAT_MODEL if needed. Tool calling supported.
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
          temperature: 0.3
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
            temperature: 0.3
        embedding:
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              # text-embedding-004 retired (404); use current Gemini embedding model
              model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
              dimensions: 768


app:
  jwt:
    secret: ${JWT_SECRET:acme-hr-assistant-dev-secret-change-me-32chars-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated origins via APP_CORS_ALLOWED_ORIGINS (platform injects per env)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  upload:
    # Plain files on disk — open even when Docker/Postgres is stopped
    local-dir: ${APP_UPLOAD_LOCAL_DIR:./data/policies}
    max-bytes: ${APP_UPLOAD_MAX_BYTES:5242880}
    allowed-types: ${APP_UPLOAD_ALLOWED_TYPES:text/markdown,text/plain,text/html,application/rtf,text/rtf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.oasis.opendocument.text}
  rag:
    top-k: ${APP_RAG_TOP_K:5}
    similarity-threshold: ${APP_RAG_SIMILARITY_THRESHOLD:0.45}
    seed-on-empty: ${APP_RAG_SEED_ON_EMPTY:true}
    # Optional: Postgres full-text + pgvector merged with reciprocal rank fusion. Measure with eval-retrieval.
    hybrid:
      enabled: ${APP_RAG_HYBRID_ENABLED:false}
      rrf-k: ${APP_RAG_HYBRID_RRF_K:60}
      candidates: ${APP_RAG_HYBRID_CANDIDATES:20}
  agent:
    max-tool-iterations: ${APP_AGENT_MAX_TOOL_ITERATIONS:8}
  actions:
    pending-ttl-minutes: ${APP_ACTIONS_PENDING_TTL_MINUTES:30}
  ratelimit:
    login-per-minute: ${APP_RATELIMIT_LOGIN_PER_MINUTE:10}
    chat-per-minute: ${APP_RATELIMIT_CHAT_PER_MINUTE:20}
    policy-write-per-minute: ${APP_RATELIMIT_POLICY_WRITE_PER_MINUTE:5}
    password-reset-per-minute: ${APP_RATELIMIT_PASSWORD_RESET_PER_MINUTE:8}
  cache:
    policies-ttl: ${APP_CACHE_POLICIES_TTL:5m}
    holidays-ttl: ${APP_CACHE_HOLIDAYS_TTL:1h}
  llm:
    read-timeout-ms: ${APP_LLM_READ_TIMEOUT_MS:60000}
  chat:
    max-message-length: ${APP_CHAT_MAX_MESSAGE_LENGTH:4000}
  otp:
    length: ${APP_OTP_LENGTH:6}
    ttl-minutes: ${APP_OTP_TTL_MINUTES:10}
    reset-token-ttl-minutes: ${APP_OTP_RESET_TOKEN_TTL_MINUTES:15}
    max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
    # When no SMS/email provider is set, accept fixed demo OTP 123456
    dev-fallback: ${APP_OTP_DEV_FALLBACK:true}
  # Preferred for India SMS testing — only one API key needed
  fast2sms:
    api-key: ${FAST2SMS_API_KEY:}
    sender-id: ${FAST2SMS_SENDER_ID:FSTSMS}
    route: ${FAST2SMS_ROUTE:q}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
  mail:
    from: ${MAIL_FROM:${SPRING_MAIL_USERNAME:}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Local demos often have no real SMTP; don't mark the whole app DOWN.
    mail:
      enabled: false
  metrics:
    tags:
      application: hr-assistant

logging:
  level:
    com.acme.hrassistant: INFO
    org.springframework.ai: INFO
