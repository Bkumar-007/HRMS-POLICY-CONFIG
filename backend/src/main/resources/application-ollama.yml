# Local-only: SPRING_PROFILES_ACTIVE=ollama
# Requires Ollama running on this machine (http://localhost:11434).
# Azure Container Apps cannot reach your laptop Ollama — keep Gemini (or host Ollama in cloud) for the live URL.

spring:
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # Prefer a tool-capable model, e.g. llama3.2 / qwen2.5 / mistral
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.3

logging:
  level:
    com.acme.hrassistant: DEBUG
    org.springframework.ai.ollama: DEBUG
