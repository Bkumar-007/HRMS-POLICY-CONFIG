# Local-only: SPRING_PROFILES_ACTIVE=ollama
# Requires Ollama running on this machine (http://localhost:11434).
# Pull models: ollama pull llama3.2 && ollama pull nomic-embed-text

spring.ai.model.chat: ollama
spring.ai.model.embedding: ollama
spring.ai.model.embedding.text: none

spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.3
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        dimensions: 768

logging:
  level:
    com.acme.hrassistant: DEBUG
    org.springframework.ai.ollama: DEBUG
